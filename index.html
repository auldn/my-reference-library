<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Reference Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Arima:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#9ca3af; --accent:#22d3ee; --border:#1f2937; --ok:#34d399; --warn:#fbbf24; --err:#f87171; }
    html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";}
    h1{font-family:'Playfair Display', serif;font-size:1.92rem;margin:.5rem 0 1rem 0}
    .wrap{max-width:1100px;margin:0 auto;padding:1rem}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
    .control-card{background:var(--card);border:1px solid var(--border);border-radius:.75rem;padding:1rem}
    .control-card h2{font-size:1.05rem;margin:0 0 .5rem 0}
    label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:.25rem}
    input[type="text"], select{width:100%;padding:.5rem .6rem;border-radius:.5rem;border:1px solid var(--border);background:#0b1020;color:var(--text)}
    button{appearance:none;background:linear-gradient(90deg,#0891b2,#22d3ee);color:#082f49;border:none;border-radius:.6rem;padding:.5rem .8rem;font-weight:600;cursor:pointer}
    .status{font-size:.9rem;color:var(--muted);margin-top:.5rem;white-space:pre-line}
    .group{margin:1rem 0;border:1px solid var(--border);border-radius:.75rem;position:relative}
    .group-header{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:#0b1020;padding:.6rem .8rem;cursor:pointer} 
    .group-header h3{margin:0;font-size:1rem}
    .group-count{font-size:.85rem;color:var(--muted)}
    .entries{position:relative;z-index:1;padding:.5rem .8rem}
    .entry{border-top:1px dashed var(--border);padding:.6rem 0;line-height:1.45;font-size:0.96em}
    .entry:first-child{border-top:none}
    .entry-title{font-family:'Arima', system-ui; font-weight:700; font-size:1.2em}
    .meta{color:var(--muted)}
    .hidden{display:none}
    .row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
    code{background:#0b1020;padding:.15rem .4rem;border-radius:.3rem;border:1px solid var(--border)}
    .link{color:var(--accent);text-decoration:none}
    .link:hover{text-decoration:underline}
    .mini-btn{background:#1f2937;color:var(--text);border:1px solid var(--border);border-radius:.5rem;padding:.2rem .45rem;font-size:.85em;cursor:pointer}
    .abstract{margin-top:.4rem;color:#cbd5e1;white-space:pre-wrap}
    .pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:.1rem .5rem;font-size:.8em;color:#a5b4fc;background:#0b1020}
    .kw{display:inline-block;border:1px solid #334155;background:#0b1020;color:#93c5fd;border-radius:999px;padding:.05rem .5rem;margin:.15rem .25rem 0 0;font-size:.78em}
    .kw-wrap{margin-top:.4rem}
    

  /* --- OA / non-OA abstract blocks --- */
  .abstract {
    margin-top: 0.5rem;
    line-height: 1.45;
  }
  .abstract.hidden { display: none; }

  .oa-abstract {
    background: #f0fdf4;         /* green-50 */
    border: 1px solid #bbf7d0;   /* green-200 */
    border-radius: 6px;
    padding: 0.75rem 0.9rem;
    color: #064e3b;              /* green-900 */
  }
  .non-oa-abstract {
    background: #f8fafc;         /* slate-50 */
    border: 1px dashed #cbd5e1;  /* slate-300 */
    border-radius: 6px;
    padding: 0.75rem 0.9rem;
  }
  .oa-abstract .attribution {
    margin-top: 0.6rem;
    font-size: 0.875rem;
    color: #065f46;              /* green-800 */
    opacity: 0.9;
  }

  /* --- OA badge next to titles --- */
  .oa-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    margin-left: 0.5rem;
    padding: 0 0.35rem;
    height: 1.1rem;
    border-radius: 0.4rem;
    font-size: 0.72rem;
    font-weight: 600;
    line-height: 1;
    color: #065f46;              /* green-800 */
    background: #d1fae5;         /* green-100 */
    border: 1px solid #a7f3d0;   /* green-200 */
    vertical-align: middle;
  }
  .oa-badge .oa-dot {
    width: 0.5rem;
    height: 0.5rem;
    background: #10b981;         /* green-500 */
    border-radius: 50%;
    display: inline-block;
  }
  .entry-title { white-space: normal; }
  .entry .ok { color: #16a34a; } /* left bullet */
  .link { color: #1d4ed8; text-decoration: none; }
  .link:hover { text-decoration: underline; }

  /* Optional: keyword pills */
  .kw-wrap { margin-top: 0.4rem; }
  .kw {
    display: inline-block;
    margin: 0 0.35rem 0.35rem 0;
    padding: 0.12rem 0.45rem;
    font-size: 0.75rem;
    border-radius: 999px;
    background: #eef2ff;         /* indigo-50 */
    color: #3730a3;              /* indigo-800 */
    border: 1px solid #c7d2fe;   /* indigo-200 */
  }

    /* Restore teal article title color */
.entry-title {
  color: #0f766e;       /* teal-700 style */
  text-decoration: none;
}

.entry-title:hover {
  color: #0d9488;       /* teal-600, slightly brighter on hover */
  text-decoration: underline;
}

.link { color: #1d4ed8; }

  </style>
</head>
<body>
<div class="wrap">
  <h1>My Reference Library</h1>

  <div class="controls">
    <div class="control-card">
      <h2>Search & Sort</h2>
      <label for="search">Search</label>
      <input id="search" type="text" placeholder="title, author, journal, year, DOI, PMID, keywords"/>
      <div style="height:.6rem"></div>
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="year_desc">Year ↓</option>
        <option value="year_asc">Year ↑</option>
        <option value="title_az">Title A–Z</option>
        <option value="title_za">Title Z–A</option>
        <option value="journal_az">Journal A–Z</option>
        <option value="author_az">First author A–Z</option>
        <option value="senior_az">Senior author A-Z</option>
      </select>
      <div style="height:.6rem"></div>
      <button id="reset">Reset</button>
      <div id="status" class="status"></div>
    </div>

    <div class="control-card">
      <h2>Add by ID</h2>
      <label for="idInput">Paste a DOI or PMID</label>
      <div class="row">
        <input id="idInput" type="text" placeholder="10.xxxx/… or 12345678" style="flex:1"/>
        <button id="addId">Add</button>
      </div>
      <div class="status" style="margin-top:.5rem">Adds immediately; fetches metadata in background.</div>
      <div style="margin-top:.5rem">
        <span class="pill" id="netIndicator">Online</span>
        <span class="pill" id="queueIndicator">Queue: 0</span>
      </div>
      <div><button id="downloadPmids" class="btn">Download PMIDs</button>
      </div>
    </div>
  </div>

  <div id="groups"></div>
</div>

<script src="java_script.js"> </script>
</body>
</html>
