<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>My Reference Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f1218;
      --card: #151a22;
      --text: #e8eef7;
      --muted: #a9b3c2;
      --accent: #3aa0ff;
      --accent-2: #00c2a8;
      --border: #263041;
      --pill-bg: #1d2430;
      --warn: #f6c34a;
      --danger: #ff6b6b;
      --ok: #57d38c;
      --link: #8acbff;
      --shadow: 0 6px 20px rgba(0,0,0,.35);
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color: var(--text);
      background: linear-gradient(180deg, #0e1117, #0f1218 120px);
    }
    .wrap {
      max-width: 1080px;
      margin: 24px auto 64px;
      padding: 0 16px;
    }
    h1 { font-weight: 700; letter-spacing: .2px; margin: 0 0 16px; }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }
    .control-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .control-card h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    label { display:block; margin: 8px 0 4px; color: var(--muted); }
    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f1218;
      color: var(--text);
      outline: none;
    }
    input[type="text"]::placeholder { color: #7d8898; }
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1c2532;
      color: var(--text);
      cursor: pointer;
    }
    button:hover { border-color: #35527c; background: #1a2a40; }
    .btn-outline-secondary {
      background: transparent;
      border-color: var(--border);
    }
    .row {
      display: flex; gap: 8px; align-items: center;
    }
    .status { color: var(--muted); font-size: 13px; min-height: 18px; }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--pill-bg);
      color: var(--muted);
      font-size: 12px;
      border: 1px solid var(--border);
      margin-right: 6px;
    }

    /* Results */
    #groups { margin-top: 18px; }
    .year-group { margin-top: 18px; }
    .year-heading {
      font-size: 16px; font-weight: 600; margin: 0 0 8px; color: #cdd6e3;
      border-bottom: 1px dashed var(--border); padding-bottom: 4px;
    }
    .ref {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 12px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0f131b;
      margin-bottom: 8px;
    }
    .ref .meta { color: var(--muted); font-size: 13px; }
    .ref .title { font-weight: 600; }
    .ref .right { text-align: right; color: var(--muted); font-size: 12px; }
    .muted { color: var(--muted); }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty {
      color: var(--muted);
      padding: 18px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      text-align: center;
      background: #0f131b;
    }

    /* Responsive fix for long authors/journals */
    .ref .title, .ref .meta { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>My Reference Library</h1>

    <div class="controls">
      <div class="control-card">
        <h2>Search &amp; Sort</h2>
        <label for="search">Search</label>
        <input id="search" type="text" placeholder="title, author, journal, year, DOI, PMID, keywords"/>
        <div style="height:.6rem"></div>
        <label for="sort">Sort</label>
        <select id="sort">
          <option value="year_desc">Year ↓</option>
          <option value="year_asc">Year ↑</option>
          <option value="title_az">Title A–Z</option>
          <option value="title_za">Title Z–A</option>
          <option value="journal_az">Journal A–Z</option>
          <option value="author_az">First author A–Z</option>
        </select>
        <div style="height:.6rem"></div>
        <button id="reset">Reset</button>
        <div id="status" class="status"></div>
      </div>

      <div class="control-card">
        <h2>Add by ID</h2>
        <label for="idInput">Paste a DOI or PMID</label>
        <div class="row">
          <input id="idInput" type="text" placeholder="10.xxxx/… or 12345678" style="flex:1"/>
          <button id="addId">Add</button>
        </div>
        <div class="status" style="margin-top:.5rem">
          Adds immediately; fetches metadata in background.
        </div>
        <div style="margin-top:.5rem">
          <span class="pill" id="netIndicator">Online</span>
          <span class="pill" id="queueIndicator">Queue: 0</span>

          <!-- Download CSV button -->
          <button id="btn-download-csv" type="button" class="btn btn-outline-secondary" style="margin-top:8px;">
            Download CSV
          </button>
        </div>
      </div>
    </div>

    <div id="groups"></div>
  </div>

  <script>
    /******************************************************************
     * Reference Library – Client-side app (GitHub Pages friendly)
     * Storage: localStorage (STORAGE_KEY)
     * Exports: CSV (UTF‑8)
     * Add by ID: DOI (Crossref → DataCite fallback) and PMID (NCBI)
     ******************************************************************/
    const STORAGE_KEY = 'reflib_items_v2';
    const CSV_HEADERS = ['title','authors','journal','year','pmid','doi','url'];

    const state = {
      references: [],   // Array of objects: {id,title,authors,journal,year,pmid,doi,url,addedAt}
      search: '',
      sort: 'year_desc',
      queue: [],        // background fetch tasks
      online: navigator.onLine
    };

    // =============== Utilities ===============
    const $ = (sel, root=document) => root.querySelector(sel);
    const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const nowISO = () => new Date().toISOString();

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : (arr.items || []);
      } catch(e) {
        console.warn('Failed to load storage', e);
        return [];
      }
    }
    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.references));
      } catch(e) {
        console.warn('Failed to save storage', e);
      }
    }

    function setStatus(msg, type='info', ms=3000) {
      const el = $('#status');
      if (!el) return;
      el.textContent = msg || '';
      if (ms) setTimeout(() => { if (el.textContent === msg) el.textContent=''; }, ms);
    }

    function updateNetIndicator() {
      state.online = navigator.onLine;
      const el = $('#netIndicator');
      if (el) {
        el.textContent = state.online ? 'Online' : 'Offline';
        el.style.color = state.online ? 'var(--ok)' : 'var(--danger)';
        el.style.borderColor = state.online ? 'rgba(87,211,140,.4)' : 'rgba(255,107,107,.4)';
      }
    }
    function updateQueueIndicator() {
      const el = $('#queueIndicator');
      if (el) el.textContent = `Queue: ${state.queue.length}`;
    }

    // =============== Render ===============
    function normalizeReference(ref) {
      // Ensure consistent keys and types
      return {
        id: ref.id ?? cryptoRandomId(),
        title: ref.title ?? '',
        authors: (typeof ref.authors === 'string')
                  ? ref.authors
                  : (Array.isArray(ref.authors) ? ref.authors.join('; ') : ''),
        journal: ref.journal ?? '',
        year: String(ref.year ?? '').trim(),
        pmid: String(ref.pmid ?? '').trim(),
        doi: (ref.doi ?? '').trim(),
        url: ref.url ?? '',
        addedAt: ref.addedAt ?? nowISO()
      };
    }

    function cryptoRandomId() {
      // Simple unique id for this page (not cryptographic UID across sessions, but stable enough)
      try {
        const b = new Uint8Array(8);
        crypto.getRandomValues(b);
        return [...b].map(x => x.toString(16).padStart(2,'0')).join('');
      } catch { return String(Date.now()) + '_' + Math.random().toString(36).slice(2); }
    }

    function filteredAndSorted(list) {
      const q = state.search.trim().toLowerCase();
      let arr = list;

      if (q) {
        arr = arr.filter(r => {
          const hay = [
            r.title, r.authors, r.journal, r.year, r.pmid, r.doi
          ].join(' ').toLowerCase();
          return hay.includes(q);
        });
      }

      switch (state.sort) {
        case 'year_desc':
          arr.sort((a,b) => (parseInt(b.year) || -Infinity) - (parseInt(a.year) || -Infinity)); break;
        case 'year_asc':
          arr.sort((a,b) => (parseInt(a.year) || Infinity) - (parseInt(b.year) || Infinity)); break;
        case 'title_az':
          arr.sort((a,b) => (a.title || '').localeCompare(b.title || '', undefined, {sensitivity:'base'})); break;
        case 'title_za':
          arr.sort((a,b) => (b.title || '').localeCompare(a.title || '', undefined, {sensitivity:'base'})); break;
        case 'journal_az':
          arr.sort((a,b) => (a.journal || '').localeCompare(b.journal || '', undefined, {sensitivity:'base'})); break;
        case 'author_az':
          // Use first author (before ';')
          const first = s => (s || '').split(';')[0].trim();
          arr.sort((a,b) => first(a.authors).localeCompare(first(b.authors), undefined, {sensitivity:'base'})); break;
      }
      return arr;
    }

    function groupByYear(arr) {
      const map = new Map();
      for (const r of arr) {
        const y = (r.year && /^\d{4}/.test(r.year)) ? r.year : 'No year';
        if (!map.has(y)) map.set(y, []);
        map.get(y).push(r);
      }
      // Present newest year first by default when grouped
      const entries = Array.from(map.entries())
        .sort((a,b) => (parseInt(b[0])||-Infinity) - (parseInt(a[0])||-Infinity));
      return entries;
    }

    function render() {
      const root = $('#groups');
      root.innerHTML = '';
      const items = filteredAndSorted(state.references.map(normalizeReference));

      if (items.length === 0) {
        root.innerHTML = `<div class="empty">No references yet. Add a DOI or PMID to get started.</div>`;
        return;
      }

      // Group by year for a nice visual
      const groups = groupByYear(items);
      for (const [year, refs] of groups) {
        const sec = document.createElement('section');
        sec.className = 'year-group';

        const h = document.createElement('h3');
        h.className = 'year-heading';
        h.textContent = year;
        sec.appendChild(h);

        for (const r of refs) {
          const item = document.createElement('div');
          item.className = 'ref';

          const left = document.createElement('div');
          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = r.title || (r.doi || r.pmid || '(untitled)');

          const meta = document.createElement('div');
          meta.className = 'meta';
          const bits = [];
          if (r.authors) bits.push(r.authors);
          if (r.journal) bits.push(r.journal);
          const tail = [];
          if (r.doi) tail.push(`DOI: ${r.doi}`);
          if (r.pmid) tail.push(`PMID: ${r.pmid}`);
          if (tail.length) bits.push(tail.join(' • '));
          meta.textContent = bits.join(' — ');

          left.appendChild(title);
          left.appendChild(meta);

          const right = document.createElement('div');
          right.className = 'right';
          if (r.url) {
            const link = document.createElement('a');
            link.href = r.url;
            link.target = '_blank';
            link.rel = 'noopener';
            link.textContent = 'Link';
            right.appendChild(link);
          }

          item.appendChild(left);
          item.appendChild(right);
          sec.appendChild(item);
        }

        root.appendChild(sec);
      }
    }

    // =============== CSV Export ===============
    function escCSV(val) {
      const s = String(val ?? '');
      const needs = /[",\n\r]/.test(s);
      const out = s.replace(/"/g, '""');
      return needs ? `"${out}"` : out;
    }
    function toCSV(rows) {
      const header = CSV_HEADERS.map(escCSV).join(',');
      const body = rows.map(r => {
        const n = normalizeReference(r);
        return CSV_HEADERS.map(h => escCSV(n[h])).join(',');
      }).join('\r\n');
      return header + '\r\n' + body;
    }
    function downloadCSV() {
      const refs = state.references;
      if (!refs || refs.length === 0) {
        alert('Your library is empty—no references to export.');
        return;
      }
      const csv = toCSV(refs);
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const t = new Date(), y = t.getFullYear(), m = String(t.getMonth()+1).padStart(2,'0'), d = String(t.getDate()).padStart(2,'0');
      const a = document.createElement('a');
      a.href = url; a.download = `references_${y}-${m}-${d}.csv`; a.style.display='none';
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
    }

    // =============== Add by ID ===============
    const DOI_PATTERN = /^10\.\d{4,9}\/[-._;()/:A-Z0-9]+$/i;
    function extractDOI(input) {
      const s = String(input).trim();
      // Accept raw DOI or prefixed URLs
      const doiFromUrl = s.match(/10\.\d{4,9}\/[-._;()/:A-Z0-9]+/i);
      if (doiFromUrl) return doiFromUrl[0];
      return DOI_PATTERN.test(s) ? s : '';
    }
    function isPMID(input) {
      return /^\d{1,9}$/.test(String(input).trim()); // simple check
    }

    function addMinimalRecordFromId(idStr) {
      const id = idStr.trim();
      const rec = normalizeReference({
        id: cryptoRandomId(),
        title: '',
        authors: '',
        journal: '',
        year: '',
        pmid: isPMID(id) ? id : '',
        doi: extractDOI(id) || '',
        url: '',
        addedAt: nowISO()
      });
      state.references.unshift(rec);
      save();
      render();
      return rec;
    }

    // ---- Metadata fetchers ----
    const politeEmail = 'YOUR_EMAIL@example.org'; // TODO: replace with your email

    async function fetchCrossref(doi) {
      const url = `https://api.crossref.org/works/${encodeURIComponent(doi)}?mailto=${encodeURIComponent(politeEmail)}`;
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) { return { ok: false, status: res.status }; }
      const data = await res.json();
      const m = data && data.message;
      if (!m) return { ok:false, status: 502 };
      const authors = (m.author || []).map(a => [a.given, a.family].filter(Boolean).join(' ')).filter(Boolean).join('; ');
      const year = (m.issued && m.issued['date-parts'] && m.issued['date-parts'][0] && m.issued['date-parts'][0][0]) || '';
      return {
        ok: true,
        rec: {
          title: (m.title && m.title[0]) || '',
          authors,
          journal: (m['container-title'] && m['container-title'][0]) || '',
          year: String(year || ''),
          pmid: '',
          doi: m.DOI || doi,
          url: m.URL || (`https://doi.org/${doi}`)
        }
      };
    }

    async function fetchDataCite(doi) {
      const url = `https://api.datacite.org/works/${encodeURIComponent(doi)}`;
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) { return { ok: false, status: res.status }; }
      const data = await res.json();
      const a = data && data.data && data.data.attributes;
      if (!a) return { ok:false, status: 502 };
      const authors = (a.creators || []).map(c => c.name || [c.givenName, c.familyName].filter(Boolean).join(' ')).filter(Boolean).join('; ');
      return {
        ok: true,
        rec: {
          title: (a.titles && a.titles[0] && a.titles[0].title) || '',
          authors,
          journal: (a.container && a.container.title) || (a.publisher || ''),
          year: String(a.publicationYear || ''),
          pmid: '',
          doi: a.doi || doi,
          url: a.url || (`https://doi.org/${doi}`)
        }
      };
    }

    async function fetchPMID(pmid) {
      // NCBI E-utilities (ESummary)
      const url = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id=${encodeURIComponent(pmid)}&retmode=json`;
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) { return { ok:false, status: res.status }; }
      const data = await res.json();
      const rec = data && data.result && data.result[pmid];
      if (!rec) return { ok:false, status: 404 };
      const authors = (rec.authors || []).map(a => a.name).filter(Boolean).join('; ');
      // year from pubdate ("2024 Jan 12")
      const year = (rec.pubdate || '').match(/\d{4}/)?.[0] || '';
      // Prefer PubMed URL, fallback to DOI if present
      const doi = (rec.elocationid || '').toLowerCase().startsWith('doi ')
        ? (rec.elocationid.split(' ')[1] || '') : (rec.articleids || []).find(x => x.idtype==='doi')?.value || '';
      const urlPM = `https://pubmed.ncbi.nlm.nih.gov/${pmid}/`;
      return {
        ok: true,
        rec: {
          title: rec.title || '',
          authors,
          journal: rec.fulljournalname || rec.source || '',
          year: String(year || ''),
          pmid: String(pmid),
          doi: doi,
          url: urlPM
        }
      };
    }

    async function enrichRecord(rec) {
      // Returns updated record (partial merge)
      if (rec.doi) {
        // Crossref → DataCite fallback
        const cr = await fetchCrossref(rec.doi).catch(() => ({ok:false}));
        if (cr && cr.ok) return cr.rec;
        if (cr && cr.status === 404) {
          const dc = await fetchDataCite(rec.doi).catch(() => ({ok:false}));
          if (dc && dc.ok) return dc.rec;
        }
      }
      if (rec.pmid) {
        const pm = await fetchPMID(rec.pmid).catch(() => ({ok:false}));
        if (pm && pm.ok) return pm.rec;
      }
      return null;
    }

    function mergeInto(target, patch) {
      // Only fill blanks or missing fields to respect "add immediately" then enhance
      const keys = ['title','authors','journal','year','pmid','doi','url'];
      for (const k of keys) {
        const oldVal = target[k];
        const newVal = patch[k];
        if (!oldVal && newVal) target[k] = newVal;
      }
      return target;
    }

    // =============== Background queue ===============
    async function processQueue() {
      updateQueueIndicator();
      if (state._processing) return;
      state._processing = true;

      while (state.queue.length) {
        const job = state.queue.shift();
        updateQueueIndicator();
        try {
          const patch = await enrichRecord(job.ref);
          if (patch) {
            // find and merge
            const idx = state.references.findIndex(r => r.id === job.ref.id);
            if (idx >= 0) {
              state.references[idx] = mergeInto(state.references[idx], patch);
              save(); render();
            }
          }
        } catch (e) {
          console.warn('Enrichment failed:', e);
        }
        // small delay to be kind to APIs
        await sleep(150);
      }
      state._processing = false;
      updateQueueIndicator();
    }

    // =============== Event wiring ===============
    function debounce(fn, ms) {
      let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Load existing
      state.references = load().map(normalizeReference);

      // Indicators
      updateNetIndicator();
      window.addEventListener('online', updateNetIndicator);
      window.addEventListener('offline', updateNetIndicator);

      // Search
      $('#search').addEventListener('input', debounce((e) => {
        state.search = e.target.value || '';
        render();
      }, 120));

      // Sort
      $('#sort').addEventListener('change', (e) => {
        state.sort = e.target.value;
        render();
      });

      // Reset
      $('#reset').addEventListener('click', () => {
        state.search = '';
        state.sort = 'year_desc';
        $('#search').value = '';
        $('#sort').value = 'year_desc';
        render();
      });

      // Add by ID
      $('#addId').addEventListener('click', async () => {
        const input = $('#idInput').value.trim();
        if (!input) { setStatus('Please paste a DOI (10.xxxx/...) or a PMID (digits).', 'warn'); return; }

        const doi = extractDOI(input);
        const pmid = isPMID(input) ? input : '';

        if (!doi && !pmid) {
          setStatus('That does not look like a DOI or a PMID. Check and try again.', 'warn');
          return;
        }

        // 1) Add minimal record immediately
        const rec = addMinimalRecordFromId(input);
        setStatus('Added. Fetching metadata in background...');
        $('#idInput').value = '';

        // 2) Queue enrichment
        state.queue.push({ type: doi ? 'doi' : 'pmid', ref: rec });
        processQueue();
      });

      // CSV
      $('#btn-download-csv').addEventListener('click', downloadCSV);

      // Initial render
      render();

      // (Optional) Example: seed two refs if library is empty (commented)
      /*
      if (state.references.length === 0) {
        state.references = [
          { title: "Why don’t all adults get multiple sclerosis?",
            authors: "Hawkes, CH; Giovannoni, G; Lechner-Scott, J; Levy, M; Yeh, A",
            journal: "Multiple Sclerosis and Related Disorders", year: "2026", pmid: "41571370", doi: "", url: "" },
          { title: "Virus antibody responses in patients with myelin oligodendrocyte glycoprotein antibody-associated disease and multiple sclerosis",
            authors: "Frederiksen, J; Žiogienė, D; Slibinskas, R; Ciplys, E; Houen, G; Trier, N",
            journal: "Multiple Sclerosis and Related Disorders", year: "2026", pmid: "41576644", doi: "", url: "" }
        ].map(normalizeReference);
        save(); render();
      }
      */
    });
  </script>
</body>
</html>
