<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Reference Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Arima:wght@400;600&display=swap" rel="stylesheet">
  <style>
   /* =========================
   CSS Variables / Theme
   ========================= */
:root {
  --bg: #0f172a;
  --card: #111827;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --accent: #22d3ee;
  --border: #1f2937;
  --ok: #34d399;
  --warn: #fbbf24;
  --err: #f87171;
}

/* =========================
   Base / Global Styles
   ========================= */
html,
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell,
    Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
}

h1 {
  font-family: "Playfair Display", serif;
  font-size: 1.92rem;
  margin: 0.5rem 0 1rem;
}

.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1rem;
}

/* =========================
   Control Panels
   ========================= */
.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 1rem;
}

.control-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 0.75rem;
  padding: 1rem;
}

.control-card h2 {
  font-size: 1.05rem;
  margin: 0 0 0.5rem;
}

label {
  display: block;
  font-size: 0.9rem;
  color: var(--muted);
  margin-bottom: 0.25rem;
}

/* =========================
   Inputs & Buttons
   ========================= */
input[type="text"],
select {
  width: 100%;
  padding: 0.5rem 0.6rem;
  border-radius: 0.5rem;
  border: 1px solid var(--border);
  background: #0b1020;
  color: var(--text);
}

button {
  appearance: none;
  background: linear-gradient(90deg, #0891b2, #22d3ee);
  color: #082f49;
  border: none;
  border-radius: 0.6rem;
  padding: 0.5rem 0.8rem;
  font-weight: 600;
  cursor: pointer;
}

/* Compact inline controls (PMID / buttons / tag input) */
.mini-btn,
.tag-input,
.pmid-wrap code {
  appearance: none;
  -webkit-appearance: none;

  display: inline-flex;
  align-items: center;

  box-sizing: border-box;
  font-family: inherit;
  font-size: inherit;
  line-height: 1;

  padding: 0.3rem 0.5rem;
}

/* Override generic text input sizing for tag input */
input.tag-input {
  appearance:none;
  -webkit-appearance: none;
  box-sizing: border-box;
  font-family: inherit;
  font-size: inherit;
  line-height:1;
  padding: 0.3rem 0.5rem;
  margin:0;
  width: 160px;
  max-width: 40vw;
  border-radius: 6px;
  border: 1px solid #334155;
  background: #0b1220;
  color: #dbe4f3;
}

/* Button-specific visuals */
.mini-btn {
  background: #1f2937;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 0.5rem;
  cursor: pointer;
}

/* =========================
   Status / Feedback
   ========================= */
.status {
  font-size: 0.9rem;
  color: var(--muted);
  margin-top: 0.5rem;
  white-space: pre-line;
}

/* =========================
   Groups & Entries
   ========================= */
.group {
  margin: 1rem 0;
  border: 1px solid var(--border);
  border-radius: 0.75rem;
  position: relative;
}

.group-header {
  position: sticky;
  top: 0;
  z-index: 2;

  display: flex;
  justify-content: space-between;
  align-items: center;

  background: #0b1020;
  border-bottom: 1px solid var(--border);
  padding: 0.6rem 0.8rem;
  cursor: pointer;
}

.group-header h3 {
  margin: 0;
  font-size: 1rem;
}

.group-count {
  font-size: 0.85rem;
  color: var(--muted);
}

.entries {
  padding: 0.5rem 0.8rem;
}

.entry {
  border-top: 1px dashed var(--border);
  padding: 0.6rem 0;
  font-size: 0.96em;
  line-height: 1.45;
}

.entry:first-child {
  border-top: none;
}

.entry-title {
  font-family: "Arima", system-ui;
  font-weight: 700;
  font-size: 1.2em;
  color: var(--accent);
  white-space: normal;
  text-decoration: none;
}

.entry-title:hover {
  color: var(--accent);
}

.entry .ok {
  color: #16a34a;
}

.meta {
  color: var(--muted);
}

/* =========================
   Controls Row (PMID / Tags / Actions)
   ========================= */
.row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}


.pmid-wrap code {
  background: #0b1020;
  border: 1px solid var(--border);
  border-radius: 0.3rem;
}

/* =========================
   Tags
   ========================= */
.tag-wrap {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;

  background: #1e293b;
  border: 1px solid #334155;
  color: #cbd5e1;

  padding: 2px 6px;
  border-radius: 999px;
  font-size: 12px;
}

.tag-label {
  cursor: pointer;
}

.tag-label:hover {
  text-decoration: underline;
}

.tag-delete {
  cursor: pointer;
  color: #94a3b8;
  margin-left: 3px;
}

.tag-delete:hover {
  color: #fca5a5;
}

/* =========================
   Keywords / Pills
   ========================= */
.kw-wrap {
  margin-top: 0.4rem;
}

.kw {
  display: inline-block;
  margin: 0 0.35rem 0.35rem 0;

  padding: 0.12rem 0.45rem;
  font-size: 0.75rem;

  border-radius: 999px;
  background: #eef2ff;
  color: #3730a3;
  border: 1px solid #c7d2fe;
}

/* =========================
   Abstract Blocks
   ========================= */
.abstract {
  margin-top: 0.5rem;
  line-height: 1.45;
  color: #cbd5e1;
  white-space: pre-wrap;
}

.abstract.hidden {
  display: none;
}

.oa-abstract,
.non-oa-abstract {
  background: var(--card);
  border-radius: 6px;
  padding: 0.75rem 0.9rem;
  color: var(--text);
}

.oa-abstract {
  border: 1px solid var(--border);
}

.non-oa-abstract {
  border: 1px dashed var(--border);
}

.oa-abstract .attribution {
  margin-top: 0.6rem;
  font-size: 0.875rem;
  color: var(--muted);
}

/* =========================
   OA Badge
   ========================= */
.oa-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;

  margin-left: 0.5rem;
  padding: 0 0.35rem;
  height: 1.1rem;

  border-radius: 0.4rem;
  font-size: 0.72rem;
  font-weight: 600;
  line-height: 1;

  color: #065f46;
  background: #d1fae5;
  border: 1px solid #a7f3d0;
}

.oa-badge .oa-dot {
  width: 0.5rem;
  height: 0.5rem;
  background: #10b981;
  border-radius: 50%;
}

  </style>
</head>
<body>
<div class="wrap">
  <h1>My Reference Library</h1>

  <div class="controls">
    <div class="control-card">
      <h2>Search & Sort</h2>
      <label for="search">Search</label>
      <input id="search" type="text" placeholder="title, author, journal, year, DOI, PMID, keywords"/>
      <div style="height:.6rem"></div>
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="year_desc">Year ↓</option>
        <option value="year_asc">Year ↑</option>
        <option value="title_az">Title A–Z</option>
        <option value="title_za">Title Z–A</option>
        <option value="journal_az">Journal A–Z</option>
        <option value="author_az">First author A–Z</option>
        <option value="senior_az">Senior author A-Z</option>
      </select>
      <div style="height: .6rem"></div>
         <!--  <div class="row"> -->
  <label for="tagFilter">Filter by tag</label>
  <select id="tagFilter">
    <option value="">All tags</option>
    <!-- JS will populate the rest -->
  </select>
    <!--  </div> -->
      <div style="height:.6rem"></div>
      <button id="reset">Reset</button>
      <div id="status" class="status"></div>
    </div>

    <div class="control-card">
      <h2>Add by ID</h2>
      <label for="idInput">Paste a DOI or PMID</label>
      <div class="row">
        <input id="idInput" type="text" placeholder="10.xxxx/… or 12345678" style="flex:1"/>
        <button id="addId">Add</button>
      </div>
      <div class="status" style="margin-top:.5rem">Adds immediately; fetches metadata in background.</div>
      <div style="margin-top:.5rem">
        <span class="pill" id="netIndicator">Online</span>
        <span class="pill" id="queueIndicator">Queue: 0</span>
      </div>
      <div><button id="downloadPmids" class="btn">Download PMIDs</button>
      </div>
    </div>
  </div>

  <div id="groups"></div>
</div>

<script src="java_script.js"> </script>
</body>
</html>
